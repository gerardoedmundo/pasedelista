<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pase de Lista 2°D</title>

<style>
body { font-family: Arial; background:#f4f6f9; padding:20px; }
.container { max-width:1000px; margin:auto; background:white; padding:20px; border-radius:10px; }
h1 { text-align:center; }
button { padding:8px; margin:3px; cursor:pointer; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th,td { border:1px solid #ddd; padding:10px; text-align:center; }
th { background:#007BFF; color:white; }
.present { background:#c8e6c9; }
.tardy { background:#fff3cd; }
.absent { background:#ffcdd2; }
</style>

</head>
<body>

<div class="container">
<h1>Pase de Lista 2°D</h1>

<button onclick="exportCSV()">📥 Descargar Excel</button>
<button onclick="guardar()">💾 Guardar</button>

<table>
<thead>
<tr>
<th>#</th>
<th>Alumno</th>
<th>Asistencia</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>

let students = JSON.parse(localStorage.getItem("lista2D")) || [
"CALIXTO GARCIA VICENTE AARON",
"CAMPOS SANCHEZ AXEL UZIEL",
"CASIMIRO GALVES ALEXIS",
"CASTAÑO IGNACIO DYLAN DAVID",
"CRISTOBAL HERNANDEZ GERARDO",
"HERNANDEZ GARCIA TOMAS ALEXANDER",
"HERNANDEZ GUTIERREZ LUIS AXAEL",
"HERNANDEZ MAYO ALMA GLORIA",
"JULIAN ESQUIVEL EMMANUEL",
"LOPEZ MAYA SANTIAGO SEBASTIAN",
"MARTINEZ CIRILO ABRIL",
"MARTINEZ INIESTRA KEBIN ALAN",
"MARTINEZ ROSAS IRENE ABIGAIL",
"MARTINEZ TROCHE YAMILETH ZAYURY",
"MENDOZA SANCHEZ JOCELYN MONTSERRAT",
"MILLAN FRIAS AMERICA SHERLYN",
"NAVA GARCIA TANIA",
"NERI FLORES ALEXANDER",
"OSORIO BELTRAN JOSE LUIS",
"PANTALEON CARBAJAL RODRIGO",
"PORFIRIO ENRIQUE EDUARDO",
"PORFIRIO ENRIQUE KEVIN JONATHAN",
"QUIROZ COLIN DALIA",
"RAMIREZ MORENO RENATA PAULETTE",
"ROMERO NAVA AMERICA FERNANDA",
"ROMERO ROMERO GABRIEL",
"SANCHEZ BERNAL WENDY DEIDAD",
"SANCHEZ NAVA GAEL FERNANDO",
"VAZQUEZ NAVARRO GERARDO",
"VILCHIS GUTIERREZ ABEL"
].map(n => ({ name:n, status:"" }));

function render(){
  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  students.forEach((s,i)=>{
    let row = document.createElement("tr");

    row.innerHTML = `
      <td>${i+1}</td>
      <td>${s.name}</td>
      <td>
        <button onclick="marcar(${i},'present')">✔</button>
        <button onclick="marcar(${i},'tardy')">⏰</button>
        <button onclick="marcar(${i},'absent')">✘</button>
      </td>
    `;

    if(s.status==="present") row.className="present";
    if(s.status==="tardy") row.className="tardy";
    if(s.status==="absent") row.className="absent";

    tabla.appendChild(row);
  });
}

function marcar(i,estado){
  students[i].status = estado;
  guardar();
  render();
}

function guardar(){
  localStorage.setItem("lista2D", JSON.stringify(students));
}

function exportCSV(){
  let csv = "No,Alumno,Asistencia\n";

  students.forEach((s,i)=>{
    let estado="";
    if(s.status==="present") estado="Presente";
    if(s.status==="tardy") estado="Retardo";
    if(s.status==="absent") estado="Falta";

    csv += `${i+1},${s.name},${estado}\n`;
  });

  let blob = new Blob([csv], {type:"text/csv"});
  let url = URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "asistencia_2D.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

render();

</script>

</body>
</html>
