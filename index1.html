<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pase de Lista Avanzado</title>

<!-- Librería para leer Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  padding: 20px;
}
.container {
  max-width: 1000px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
}
h1 {
  text-align: center;
}
button, input {
  padding: 10px;
  margin: 5px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}
th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
}
th {
  background: #007BFF;
  color: white;
}
.present { background: #c8e6c9; }
.tardy { background: #fff3cd; }
.absent { background: #ffcdd2; }
</style>
</head>

<body>

<div class="container">
<h1>Pase de Lista</h1>

<input type="file" id="fileInput" accept=".xlsx">
<button onclick="loadExcel()">Cargar Excel</button>
<button onclick="saveData()">Guardar</button>
<button onclick="exportCSV()">Descargar Excel</button>

<table>
<thead>
<tr>
<th>#</th>
<th>Nombre</th>
<th>Asistencia</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<script>

let students = [];

function renderTable() {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  students.forEach((s, i) => {
    let row = document.createElement("tr");

    row.innerHTML = `
      <td>${i+1}</td>
      <td>${s.name}</td>
      <td>
        <button onclick="mark(${i}, 'present')">✔</button>
        <button onclick="mark(${i}, 'tardy')">⏰</button>
        <button onclick="mark(${i}, 'absent')">✘</button>
      </td>
    `;

    if (s.status === "present") row.className = "present";
    if (s.status === "tardy") row.className = "tardy";
    if (s.status === "absent") row.className = "absent";

    tbody.appendChild(row);
  });
}

function mark(index, status) {
  students[index].status = status;
  renderTable();
}

function loadExcel() {
  const file = document.getElementById("fileInput").files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    students = [];

    json.forEach((row, i) => {
      if (i !== 0 && row[0]) { // evita encabezado
        students.push({
          name: row[0],
          status: ""
        });
      }
    });

    renderTable();
  };

  reader.readAsArrayBuffer(file);
}

function saveData() {
  localStorage.setItem("students", JSON.stringify(students));
  alert("Guardado correctamente");
}

function exportCSV() {
  let csv = "Numero,Nombre,Asistencia\n";

  students.forEach((s, i) => {
    let statusText = "";
    if (s.status === "present") statusText = "Presente";
    if (s.status === "tardy") statusText = "Retardo";
    if (s.status === "absent") statusText = "Falta";

    csv += `${i+1},${s.name},${statusText}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = window.URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "asistencia.csv";
  a.click();
}

// Cargar datos guardados automáticamente
window.onload = function() {
  const data = localStorage.getItem("students");
  if (data) {
    students = JSON.parse(data);
    renderTable();
  }
};

</script>

</body>
</html>
