<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pase de Lista PRO+</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Segoe UI',system-ui;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  padding:15px;
}

/* CONTENEDOR */
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

/* HEADER */
.header{
  text-align:center;
  margin-bottom:15px;
}
.header h1{font-size:22px;}
.header p{font-size:13px;color:#cbd5e1;}

/* TOP */
.top{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:space-between;
}

/* INPUTS */
select,input{
  padding:10px;
  border-radius:12px;
  border:none;
  background:rgba(255,255,255,0.1);
  color:white;
}

input::placeholder{color:#cbd5e1;}

/* FECHA */
.fecha{
  padding:6px 12px;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
  font-size:12px;
}

/* STATS */
.stats{
  display:flex;
  gap:8px;
}
.stats div{
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:bold;
}
.p{background:#22c55e33;color:#4ade80;}
.r{background:#f59e0b33;color:#fbbf24;}
.f{background:#ef444433;color:#f87171;}

/* BOTONES */
button{
  border:none;
  border-radius:12px;
  padding:8px 10px;
  cursor:pointer;
  transition:0.2s;
}
button:hover{transform:scale(1.05);}

.btn-main{background:#6366f1;color:white;}
.btn-green{background:#22c55e;}
.btn-gray{background:#64748b;}

.btn-presente{background:#22c55e;}
.btn-retardo{background:#f59e0b;}
.btn-falta{background:#ef4444;}
.btn-eliminar{background:#94a3b8;}

/* LISTA */
tbody tr{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,0.08);
  padding:12px;
  border-radius:12px;
  margin:8px 0;
}

tbody tr:hover{
  background:rgba(255,255,255,0.15);
}

/* NOMBRE */
td:nth-child(2){
  flex:1;
  margin-left:10px;
}

/* BOTONES */
td:last-child{
  display:flex;
  gap:5px;
}

/* ESTADOS */
.present{border-left:4px solid #22c55e;}
.tardy{border-left:4px solid #f59e0b;}
.absent{border-left:4px solid #ef4444;}

@media(max-width:600px){
  tbody tr{flex-direction:column;align-items:flex-start;}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1 id="titulo"></h1>
  <p>Control de asistencia escolar</p>
</div>

<div class="top">

<select id="grupo" onchange="cambiarGrupo()">
  <option value="2D">2°D</option>
  <option value="1D">1°D</option>
  <option value="1E">1°E</option>
</select>

<input type="text" id="search" placeholder="Buscar..." onkeyup="render()">

<div class="fecha" id="fecha"></div>

<div class="stats" id="stats"></div>

<button class="btn-green" onclick="agregarAlumno()">➕</button>
<button class="btn-gray" onclick="verPapelera()">♻️</button>
<button class="btn-main" onclick="exportCSV()">⬇️</button>

</div>

<table>
<tbody id="tabla"></tbody>
</table>

</div>

const hoy=new Date();
document.getElementById("fecha").textContent=hoy.toLocaleDateString("es-MX");

let grupoActual="2D";
let students=gruposBase[grupoActual].map(n=>({name:n,status:""}));
let trash=[];

function cambiarGrupo(){
  grupoActual=document.getElementById("grupo").value;
  students=gruposBase[grupoActual].map(n=>({name:n,status:""}));
  render();
}

function render(){
  const tabla=document.getElementById("tabla");
  const filtro=document.getElementById("search").value.toLowerCase();
  tabla.innerHTML="";
  let p=0,r=0,f=0;

  students.forEach((s,i)=>{
    if(!s.name.toLowerCase().includes(filtro)) return;

    let row=document.createElement("tr");

    row.innerHTML=`
    <td>${i+1}</td>
    <td>${s.name}</td>
    <td>
      <button class="btn-presente" onclick="marcar(${i},'present')">✔</button>
      <button class="btn-retardo" onclick="marcar(${i},'tardy')">⏰</button>
      <button class="btn-falta" onclick="marcar(${i},'absent')">✘</button>
      <button class="btn-eliminar" onclick="eliminar(${i})">🗑️</button>
    </td>`;

    if(s.status==="present"){row.classList.add("present");p++;}
    if(s.status==="tardy"){row.classList.add("tardy");r++;}
    if(s.status==="absent"){row.classList.add("absent");f++;}

    tabla.appendChild(row);
  });

  document.getElementById("stats").innerHTML=
  `<div class="p">✔ ${p}</div>
   <div class="r">⏰ ${r}</div>
   <div class="f">✘ ${f}</div>`;
}

function marcar(i,e){students[i].status=e;render();}
function eliminar(i){trash.push(students[i]);students.splice(i,1);render();}
function agregarAlumno(){
  let n=prompt("Nombre:");
  if(!n)return;
  students.push({name:n.toUpperCase(),status:""});
  render();
}

function verPapelera(){
  let lista=trash.map((a,i)=>`${i+1}. ${a.name}`).join("\n");
  let op=prompt(lista);
  let i=parseInt(op)-1;
  if(trash[i]){
    students.push(trash[i]);
    trash.splice(i,1);
    render();
  }
}

function exportCSV(){
  let csv="Alumno,Estado\n";
  students.forEach(s=>csv+=`${s.name},${s.status}\n`);
  let blob=new Blob([csv]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="lista.csv";
  a.click();
}

document.getElementById("titulo").textContent="Pase de Lista "+grupoActual;
render();

</script>

</html>
