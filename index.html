<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pase de Lista PRO+</title>

<style>
body {
  font-family: 'Segoe UI', Arial;
  background: linear-gradient(135deg,#4facfe,#00f2fe);
  margin:0;
  padding:10px;
}

.container {
  max-width:900px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

h1 {
  text-align:center;
  margin:5px 0 10px;
}

.top {
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

select, input {
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

.fecha {
  font-size:13px;
  background:#f1f3f6;
  padding:6px 10px;
  border-radius:6px;
}

.stats {
  font-size:13px;
  font-weight:bold;
}

button {
  border:none;
  border-radius:8px;
  padding:6px 10px;
  cursor:pointer;
  transition:.2s;
}

button:hover { transform:scale(1.05); }

.btn-main { background:#007BFF; color:white; }
.btn-green { background:#28a745; color:white; }
.btn-gray { background:#6c757d; color:white; }

.btn-presente { background:#4CAF50; color:white; }
.btn-retardo { background:#FFC107; }
.btn-falta { background:#F44336; color:white; }
.btn-eliminar { background:#9e9e9e; color:white; }

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th {
  background:#007BFF;
  color:white;
  padding:8px;
}

td {
  padding:6px;
  border-bottom:1px solid #eee;
}

td:last-child {
  display:flex;
  justify-content:center;
  gap:5px;
}

.present { background:#e8f5e9; }
.tardy { background:#fff8e1; }
.absent { background:#fdecea; }

</style>
</head>

<body>

<div class="container">

<h1 id="titulo">Pase de Lista</h1>

<div class="top">

<select id="grupo" onchange="cambiarGrupo()">
  <option value="2D">2°D</option>
  <option value="1D">1°D</option>
  <option value="1E">1°E</option>
</select>

<input type="text" id="search" placeholder="Buscar..." onkeyup="render()">

<div class="fecha" id="fecha"></div>

<div class="stats" id="stats"></div>

<button class="btn-green" onclick="agregarAlumno()">➕</button>
<button class="btn-gray" onclick="verPapelera()">♻️</button>
<button class="btn-main" onclick="exportCSV()">⬇️</button>

</div>

<table>
<thead>
<tr>
<th>#</th>
<th>Alumno</th>
<th>Asistencia</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>

// LISTAS BASE
const gruposBase = {
  "2D": [
    "CALIXTO GARCIA VICENTE AARON",
    "CAMPOS SANCHEZ AXEL UZIEL",
    "CASIMIRO GALVES ALEXIS",
    "CASTAÑO IGNACIO DYLAN DAVID",
    "CRISTOBAL HERNANDEZ GERARDO",
    "HERNANDEZ GARCIA TOMAS ALEXANDER",
    "HERNANDEZ GUTIERREZ LUIS AXAEL",
    "HERNANDEZ MAYO ALMA GLORIA",
    "JULIAN ESQUIVEL EMMANUEL",
    "LOPEZ MAYA SANTIAGO SEBASTIAN",
    "MARTINEZ CIRILO ABRIL",
    "MARTINEZ INIESTRA KEBIN ALAN",
    "MARTINEZ ROSAS IRENE ABIGAIL",
    "MARTINEZ TROCHE YAMILETH ZAYURY",
    "MENDOZA SANCHEZ JOCELYN MONTSERRAT",
    "MILLAN FRIAS AMERICA SHERLYN",
    "NAVA GARCIA TANIA",
    "NERI FLORES ALEXANDER",
    "OSORIO BELTRAN JOSE LUIS",
    "PANTALEON CARBAJAL RODRIGO",
    "PORFIRIO ENRIQUE EDUARDO",
    "PORFIRIO ENRIQUE KEVIN JONATHAN",
    "QUIROZ COLIN DALIA",
    "RAMIREZ MORENO RENATA PAULETTE",
    "ROMERO NAVA AMERICA FERNANDA",
    "ROMERO ROMERO GABRIEL",
    "SANCHEZ BERNAL WENDY DEIDAD",
    "SANCHEZ NAVA GAEL FERNANDO",
    "VAZQUEZ NAVARRO GERARDO",
    "VILCHIS GUTIERREZ ABEL"
  ],
  "1D": [],
  "1E": []
};

const hoy = new Date();
const fechaTexto = hoy.toLocaleDateString("es-MX", {
  day:"numeric", month:"long", year:"numeric"
});
document.getElementById("fecha").textContent = fechaTexto;

let grupoActual = localStorage.getItem("grupo") || "2D";
document.getElementById("grupo").value = grupoActual;

let clave = getClave();
let students = cargar();
let trash = JSON.parse(localStorage.getItem("trash")) || [];

// CLAVE POR GRUPO Y FECHA
function getClave(){
  return grupoActual + "_" + hoy.toISOString().split("T")[0];
}

// CARGAR DATOS
function cargar(){
  let data = JSON.parse(localStorage.getItem(clave));

  if(data) return data;

  let base = (gruposBase[grupoActual] || []).map(n=>({name:n,status:""}));

  // ORDEN AUTOMÁTICO
  base.sort((a,b)=>a.name.localeCompare(b.name));

  return base;
}

// GUARDAR
function save(){
  localStorage.setItem(clave, JSON.stringify(students));
  localStorage.setItem("trash", JSON.stringify(trash));
}

// CAMBIAR GRUPO
function cambiarGrupo(){
  grupoActual = document.getElementById("grupo").value;
  localStorage.setItem("grupo", grupoActual);

  clave = getClave();
  students = cargar();

  document.getElementById("titulo").textContent = "Pase de Lista " + grupoActual;

  render();
}

// RENDER
function render(){
  const tabla = document.getElementById("tabla");
  const filtro = document.getElementById("search").value.toLowerCase();

  tabla.innerHTML = "";

  let p=0,r=0,f=0;

  students.forEach((s,i)=>{

    if(!s.name.toLowerCase().includes(filtro)) return;

    let row = document.createElement("tr");

    row.innerHTML = `
    <td>${i+1}</td>
    <td>${s.name}</td>
    <td>
      <button class="btn-presente" onclick="marcar(${i},'present')">✔</button>
      <button class="btn-retardo" onclick="marcar(${i},'tardy')">⏰</button>
      <button class="btn-falta" onclick="marcar(${i},'absent')">✘</button>
      <button class="btn-eliminar" onclick="eliminar(${i})">🗑️</button>
    </td>`;

    if(s.status==="present"){row.className="present";p++;}
    if(s.status==="tardy"){row.className="tardy";r++;}
    if(s.status==="absent"){row.className="absent";f++;}

    tabla.appendChild(row);
  });

  document.getElementById("stats").innerHTML =
    `✔ ${p} | ⏰ ${r} | ✘ ${f}`;
}

// FUNCIONES
function marcar(i,estado){
  students[i].status=estado;
  save();
  render();
}

function eliminar(i){
  if(confirm("¿Eliminar alumno?")){
    trash.push(students[i]);
    students.splice(i,1);
    save();
    render();
  }
}

function agregarAlumno(){
  let nombre = prompt("Nombre del alumno:");
  if(!nombre) return;

  students.push({name:nombre.toUpperCase(),status:""});
  students.sort((a,b)=>a.name.localeCompare(b.name));

  save();
  render();
}

function verPapelera(){
  if(trash.length===0) return alert("Papelera vacía");

  let lista = trash.map((a,i)=>`${i+1}. ${a.name}`).join("\n");
  let op = prompt("Papelera:\n\n"+lista+"\n\nNúmero para restaurar:");

  let i = parseInt(op)-1;

  if(trash[i]){
    students.push(trash[i]);
    trash.splice(i,1);

    students.sort((a,b)=>a.name.localeCompare(b.name));

    save();
    render();
  }
}

// EXPORTAR
function exportCSV(){
  let csv="Grupo,"+grupoActual+"\nFecha,"+fechaTexto+"\n\nNo,Alumno,Estado\n";

  students.forEach((s,i)=>{
    let e="";
    if(s.status==="present") e="Presente";
    if(s.status==="tardy") e="Retardo";
    if(s.status==="absent") e="Falta";

    csv+=`${i+1},${s.name},${e}\n`;
  });

  let blob=new Blob([csv]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="lista_"+grupoActual+".csv";
  a.click();
}

// INICIO
document.getElementById("titulo").textContent = "Pase de Lista " + grupoActual;
render();

</script>

</body>
</html>
