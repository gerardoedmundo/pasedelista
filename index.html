<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pase de Lista PRO+</title>

<style>
*{box-sizing:border-box}

body {
  font-family: 'Segoe UI', system-ui;
  background: linear-gradient(135deg,#667eea,#764ba2);
  margin:0;
  padding:10px;
}

/* CONTENEDOR */
.container {
  max-width:900px;
  margin:auto;
  background:rgba(255,255,255,0.9);
  backdrop-filter: blur(12px);
  padding:18px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* TITULO */
h1 {
  text-align:center;
  margin:5px 0 15px;
}

/* TOP */
.top {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:space-between;
  align-items:center;
}

/* INPUTS */
select,input {
  padding:10px;
  border-radius:10px;
  border:none;
  background:#f1f3f7;
}

/* FECHA */
.fecha {
  background:#eef2ff;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
}

/* STATS */
.stats {
  display:flex;
  gap:8px;
}

.stats span{
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.p{background:#d4edda;}
.r{background:#fff3cd;}
.f{background:#f8d7da;}

/* BOTONES */
button {
  border:none;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
  transition:0.2s;
}

button:hover {
  transform:translateY(-2px);
}

.btn-main { background:#4f46e5; color:white; }
.btn-green { background:#10b981; color:white; }
.btn-gray { background:#6b7280; color:white; }

.btn-presente { background:#22c55e; color:white; }
.btn-retardo { background:#f59e0b; color:white; }
.btn-falta { background:#ef4444; color:white; }
.btn-eliminar { background:#9ca3af; color:white; }

/* TABLA */
table {
  width:100%;
  margin-top:15px;
}

tbody tr {
  display:grid;
  grid-template-columns:40px 1fr auto;
  gap:10px;
  background:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  align-items:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

/* ESTADOS */
.present { border-left:5px solid #22c55e; }
.tardy { border-left:5px solid #f59e0b; }
.absent { border-left:5px solid #ef4444; }

/* BOTONES CELDA */
td:last-child {
  display:flex;
  gap:5px;
  justify-content:flex-end;
}

</style>
</head>

<body>

<div class="container">

<h1 id="titulo">Pase de Lista</h1>

<div class="top">

<select id="grupo" onchange="cambiarGrupo()">
  <option value="2D">2°D</option>
  <option value="1D">1°D</option>
  <option value="1E">1°E</option>
</select>

<input type="text" id="search" placeholder="Buscar..." onkeyup="render()">

<div class="fecha" id="fecha"></div>

<div class="stats" id="stats"></div>

<button class="btn-green" onclick="agregarAlumno()">➕</button>
<button class="btn-gray" onclick="verPapelera()">♻️</button>
<button class="btn-main" onclick="exportCSV()">⬇️</button>

</div>

<table>
<tbody id="tabla"></tbody>
</table>

</div>

<script>

// BASE
const gruposBase = {
  "2D": [
    "CALIXTO GARCIA VICENTE AARON",
    "CAMPOS SANCHEZ AXEL UZIEL",
    "CASIMIRO GALVES ALEXIS",
    "CASTAÑO IGNACIO DYLAN DAVID",
    "CRISTOBAL HERNANDEZ GERARDO",
    "HERNANDEZ GARCIA TOMAS ALEXANDER",
    "HERNANDEZ GUTIERREZ LUIS AXAEL",
    "HERNANDEZ MAYO ALMA GLORIA",
    "JULIAN ESQUIVEL EMMANUEL",
    "LOPEZ MAYA SANTIAGO SEBASTIAN",
    "MARTINEZ CIRILO ABRIL",
    "MARTINEZ INIESTRA KEBIN ALAN",
    "MARTINEZ ROSAS IRENE ABIGAIL",
    "MARTINEZ TROCHE YAMILETH ZAYURY",
    "MENDOZA SANCHEZ JOCELYN MONTSERRAT",
    "MILLAN FRIAS AMERICA SHERLYN",
    "NAVA GARCIA TANIA",
    "NERI FLORES ALEXANDER",
    "OSORIO BELTRAN JOSE LUIS",
    "PANTALEON CARBAJAL RODRIGO",
    "PORFIRIO ENRIQUE EDUARDO",
    "PORFIRIO ENRIQUE KEVIN JONATHAN",
    "QUIROZ COLIN DALIA",
    "RAMIREZ MORENO RENATA PAULETTE",
    "ROMERO NAVA AMERICA FERNANDA",
    "ROMERO ROMERO GABRIEL",
    "SANCHEZ BERNAL WENDY DEIDAD",
    "SANCHEZ NAVA GAEL FERNANDO",
    "VAZQUEZ NAVARRO GERARDO",
    "VILCHIS GUTIERREZ ABEL"
  ],
  "1D": [],
  "1E": []
};

const hoy = new Date();
const fechaTexto = hoy.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
document.getElementById("fecha").textContent = fechaTexto;

let grupoActual = localStorage.getItem("grupo") || "2D";
document.getElementById("grupo").value = grupoActual;

let clave = getClave();
let students = cargar();
let trash = JSON.parse(localStorage.getItem("trash")) || [];

function getClave(){
  return grupoActual + "_" + hoy.toISOString().split("T")[0];
}

function cargar(){
  let data = JSON.parse(localStorage.getItem(clave));
  if(data) return data;

  let base = (gruposBase[grupoActual]||[]).map(n=>({name:n,status:""}));
  base.sort((a,b)=>a.name.localeCompare(b.name));
  return base;
}

function save(){
  localStorage.setItem(clave, JSON.stringify(students));
  localStorage.setItem("trash", JSON.stringify(trash));
}

function cambiarGrupo(){
  grupoActual = document.getElementById("grupo").value;
  localStorage.setItem("grupo", grupoActual);
  clave = getClave();
  students = cargar();
  document.getElementById("titulo").textContent="Pase de Lista "+grupoActual;
  render();
}

function render(){
  const tabla=document.getElementById("tabla");
  const filtro=document.getElementById("search").value.toLowerCase();
  tabla.innerHTML="";

  let p=0,r=0,f=0;

  students.forEach((s,i)=>{
    if(!s.name.toLowerCase().includes(filtro)) return;

    let row=document.createElement("tr");

    row.innerHTML=`
      <td>${i+1}</td>
      <td>${s.name}</td>
      <td>
        <button class="btn-presente" onclick="marcar(${i},'present')">✔</button>
        <button class="btn-retardo" onclick="marcar(${i},'tardy')">⏰</button>
        <button class="btn-falta" onclick="marcar(${i},'absent')">✘</button>
        <button class="btn-eliminar" onclick="eliminar(${i})">🗑️</button>
      </td>`;

    if(s.status==="present"){row.classList.add("present");p++;}
    if(s.status==="tardy"){row.classList.add("tardy");r++;}
    if(s.status==="absent"){row.classList.add("absent");f++;}

    tabla.appendChild(row);
  });

  document.getElementById("stats").innerHTML =
    `<span class="p">✔ ${p}</span>
     <span class="r">⏰ ${r}</span>
     <span class="f">✘ ${f}</span>`;
}

function marcar(i,estado){
  students[i].status=estado;
  save();
  render();
}

function eliminar(i){
  if(confirm("¿Eliminar alumno?")){
    trash.push(students[i]);
    students.splice(i,1);
    save();
    render();
  }
}

function agregarAlumno(){
  let nombre=prompt("Nombre:");
  if(!nombre) return;

  students.push({name:nombre.toUpperCase(),status:""});
  students.sort((a,b)=>a.name.localeCompare(b.name));
  save();
  render();
}

function verPapelera(){
  if(trash.length===0) return alert("Vacía");

  let lista=trash.map((a,i)=>`${i+1}. ${a.name}`).join("\n");
  let op=prompt("Papelera:\n\n"+lista);

  let i=parseInt(op)-1;
  if(trash[i]){
    students.push(trash[i]);
    trash.splice(i,1);
    students.sort((a,b)=>a.name.localeCompare(b.name));
    save();
    render();
  }
}

function exportCSV(){
  let csv="Grupo,"+grupoActual+"\nFecha,"+fechaTexto+"\n\nNo,Alumno,Estado\n";

  students.forEach((s,i)=>{
    let e="";
    if(s.status==="present") e="Presente";
    if(s.status==="tardy") e="Retardo";
    if(s.status==="absent") e="Falta";
    csv+=`${i+1},${s.name},${e}\n`;
  });

  let blob=new Blob([csv]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="lista_"+grupoActual+".csv";
  a.click();
}

document.getElementById("titulo").textContent="Pase de Lista "+grupoActual;
render();

</script>

</body>
</html>
