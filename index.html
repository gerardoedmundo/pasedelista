*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  padding:15px;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
}
.panel{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px;}
select,input{
  padding:10px;border-radius:12px;border:none;
  background:rgba(255,255,255,0.1);color:white;
}
.card{flex:1;padding:10px;border-radius:12px;text-align:center;}
.p{background:#22c55e33}.r{background:#f59e0b33}.f{background:#ef444433}

.alumno{
  display:grid;
  grid-template-columns:40px 1fr 40px auto;
  gap:10px;
  background:rgba(255,255,255,0.08);
  padding:10px;border-radius:12px;margin:6px 0;
}
.h{background:#3b82f633;text-align:center;border-radius:8px}
.m{background:#ec489933;text-align:center;border-radius:8px}
.present{border-left:4px solid #22c55e}
.tardy{border-left:4px solid #f59e0b}
.absent{border-left:4px solid #ef4444}

button{border:none;border-radius:10px;padding:6px;cursor:pointer}
.btn-presente{background:#22c55e}
.btn-retardo{background:#f59e0b}
.btn-falta{background:#ef4444}
.btn-eliminar{background:#94a3b8}
.btn-main{background:#6366f1;color:white}
.btn-green{background:#22c55e}

let grupoActual="2D_M";
let alumnos=[];

function cambiarGrupo(){
  grupoActual=document.getElementById("grupo").value;
  alumnos=JSON.parse(JSON.stringify(grupos[grupoActual]));
  alumnos.forEach(a=>a.status="");
  render();
}

function render(){
  let lista=document.getElementById("lista");
  let filtro=document.getElementById("search").value.toLowerCase();
  lista.innerHTML="";
  let p=0,r=0,f=0;

  alumnos.forEach((a,i)=>{
    if(!a.name.toLowerCase().includes(filtro)) return;

    let div=document.createElement("div");
    div.className="alumno";

    if(a.status==="present"){div.classList.add("present");p++;}
    if(a.status==="tardy"){div.classList.add("tardy");r++;}
    if(a.status==="absent"){div.classList.add("absent");f++;}

    div.innerHTML=`
    <div>${i+1}</div>
    <div>${a.name}</div>
    <div class="${a.g==='H'?'h':'m'}">${a.g}</div>
    <div>
      <button class="btn-presente" onclick="marcar(${i},'present')">✔</button>
      <button class="btn-retardo" onclick="marcar(${i},'tardy')">⏰</button>
      <button class="btn-falta" onclick="marcar(${i},'absent')">✘</button>
      <button class="btn-eliminar" onclick="eliminar(${i})">🗑️</button>
    </div>`;
    lista.appendChild(div);
  });

  document.getElementById("titulo").innerText="Grupo "+grupoActual;
  document.getElementById("p").innerText="✔ "+p;
  document.getElementById("r").innerText="⏰ "+r;
  document.getElementById("f").innerText="✘ "+f;
}

function marcar(i,e){alumnos[i].status=e;render();}
function eliminar(i){alumnos.splice(i,1);render();}

function agregarAlumno(){
  let n=prompt("Nombre:");
  let g=prompt("Genero (H/M):");
  if(!n||!g)return;
  alumnos.push({name:n.toUpperCase(),g:g.toUpperCase(),status:""});
  render();
}

function exportCSV(){
  let csv="No,Alumno,Genero,Estado\n";
  alumnos.forEach((a,i)=>csv+=`${i+1},${a.name},${a.g},${a.status}\n`);
  let blob=new Blob([csv]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="asistencia.csv";
  a.click();
}
