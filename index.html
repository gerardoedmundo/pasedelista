<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Escolar PRO+</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  padding:15px;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
}
.panel{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px;}
select,input{
  padding:10px;border-radius:12px;border:none;
  background:rgba(255,255,255,0.1);color:white;
}
.card{flex:1;padding:10px;border-radius:12px;text-align:center;}
.p{background:#22c55e33}.r{background:#f59e0b33}.f{background:#ef444433}

.alumno{
  display:grid;
  grid-template-columns:35px 1fr 80px auto;
  gap:8px;
  background:rgba(255,255,255,0.08);
  padding:8px;border-radius:12px;margin:5px 0;
  align-items:center;
}

.alumno input{
  width:70px;
  text-align:center;
}

.present{border-left:4px solid #22c55e}
.tardy{border-left:4px solid #f59e0b}
.absent{border-left:4px solid #ef4444}

button{
  border:none;border-radius:8px;padding:5px;cursor:pointer;
}
.btn-presente{background:#22c55e}
.btn-retardo{background:#f59e0b}
.btn-falta{background:#ef4444}
.btn-main{background:#6366f1;color:white}
.btn-green{background:#22c55e}
.btn-blue{background:#3b82f6}

.fecha{
  text-align:center;
  margin-bottom:10px;
  color:#cbd5f5;
}
</style>
</head>

<body>

<div class="container">

<h2 id="titulo"></h2>
<div class="fecha" id="fecha"></div>

<div class="panel">
<select id="grupo" onchange="cambiarGrupo()">
<option value="2D_M">2°D Matutino</option>
<option value="1E_M">1°E Matutino</option>
<option value="1D_M">1°D Matutino</option>
<option value="1D_V">1°D Vespertino</option>
</select>

<input type="text" id="search" placeholder="Buscar..." onkeyup="render()">

<button class="btn-green" onclick="agregarAlumno()">➕</button>
<button class="btn-main" onclick="exportCSV()">⬇️ Asistencia</button>
<button class="btn-blue" onclick="exportCalificaciones()">⬇️ Calificaciones</button>
</div>

<div class="panel">
<div class="card p" id="p"></div>
<div class="card r" id="r"></div>
<div class="card f" id="f"></div>
</div>

<div id="lista"></div>

</div>

<script>

// FECHA
const hoy = new Date();
const fechaClave = hoy.toISOString().split("T")[0];
const fechaTexto = hoy.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
document.getElementById("fecha").innerText = "Fecha: " + fechaTexto;


// 🔥 TUS GRUPOS COMPLETOS
const grupos={

"2D_M":[
{name:"CALIXTO GARCIA VICENTE AARON"},
{name:"CAMPOS SANCHEZ AXEL UZIEL"},
{name:"CASIMIRO GALVES ALEXIS"},
{name:"CASTAÑO IGNACIO DYLAN DAVID"},
{name:"CRISTOBAL HERNANDEZ GERARDO"},
{name:"HERNANDEZ GARCIA TOMAS ALEXANDER"},
{name:"HERNANDEZ GUTIERREZ LUIS AXAEL"},
{name:"HERNANDEZ MAYO ALMA GLORIA"},
{name:"JULIAN ESQUIVEL EMMANUEL"},
{name:"LOPEZ MAYA SANTIAGO SEBASTIAN"},
{name:"MARTINEZ CIRILO ABRIL"},
{name:"MARTINEZ INIESTRA KEBIN ALAN"},
{name:"MARTINEZ ROSAS IRENE ABIGAIL"},
{name:"MARTINEZ TROCHE YAMILETH ZAYURY"},
{name:"MENDOZA SANCHEZ JOCELYN MONTSERRAT"},
{name:"MILLAN FRIAS AMERICA SHERLYN"},
{name:"NAVA GARCIA TANIA"},
{name:"NERI FLORES ALEXANDER"},
{name:"OSORIO BELTRAN JOSE LUIS"},
{name:"PANTALEON CARBAJAL RODRIGO"},
{name:"PORFIRIO ENRIQUE EDUARDO"},
{name:"PORFIRIO ENRIQUE KEVIN JONATHAN"},
{name:"QUIROZ COLIN DALIA"},
{name:"RAMIREZ MORENO RENATA PAULETTE"},
{name:"ROMERO NAVA AMERICA FERNANDA"},
{name:"ROMERO ROMERO GABRIEL"},
{name:"SANCHEZ BERNAL WENDY DEIDAD"},
{name:"SANCHEZ NAVA GAEL FERNANDO"},
{name:"VAZQUEZ NAVARRO GERARDO"},
{name:"VILCHIS GUTIERREZ ABEL"}
],

// puedes dejar los demás grupos igual que ya los tienes
"1E_M":[],
"1D_M":[],
"1D_V":[]
};

let grupoActual="2D_M";
let alumnos=[];

// CAMBIAR GRUPO
function cambiarGrupo(){
  grupoActual=document.getElementById("grupo").value;

  let guardado=localStorage.getItem(grupoActual);

  if(guardado){
    alumnos=JSON.parse(guardado);
  }else{
    alumnos=JSON.parse(JSON.stringify(grupos[grupoActual]));
    alumnos.forEach(a=>{
      a.status="";
      a.calificacion="";
    });
  }

  render();
}

// RENDER
function render(){
  let lista=document.getElementById("lista");
  let filtro=document.getElementById("search").value.toLowerCase();
  lista.innerHTML="";
  let p=0,r=0,f=0;

  alumnos.forEach((a,i)=>{
    if(!a.name.toLowerCase().includes(filtro)) return;

    let div=document.createElement("div");
    div.className="alumno";

    if(a.status==="present"){div.classList.add("present");p++;}
    if(a.status==="tardy"){div.classList.add("tardy");r++;}
    if(a.status==="absent"){div.classList.add("absent");f++;}

    div.innerHTML=`
    <div>${i+1}</div>
    <div>${a.name}</div>

    <input type="number" min="0" max="10" step="0.1"
      value="${a.calificacion||''}"
      onchange="guardarCalificacion(${i},this.value)">

    <div>
      <button class="btn-presente" onclick="marcar(${i},'present')">✔</button>
      <button class="btn-retardo" onclick="marcar(${i},'tardy')">⏰</button>
      <button class="btn-falta" onclick="marcar(${i},'absent')">✘</button>
    </div>`;

    lista.appendChild(div);
  });

  document.getElementById("titulo").innerText="Grupo "+grupoActual;
  document.getElementById("p").innerText="✔ "+p;
  document.getElementById("r").innerText="⏰ "+r;
  document.getElementById("f").innerText="✘ "+f;
}

// GUARDAR
function guardar(){
  localStorage.setItem(grupoActual,JSON.stringify(alumnos));
}

function marcar(i,e){
  alumnos[i].status=e;
  guardar();
  render();
}

function guardarCalificacion(i,val){
  alumnos[i].calificacion=val;
  guardar();
}

function agregarAlumno(){
  let n=prompt("Nombre:");
  if(!n)return;
  alumnos.push({name:n.toUpperCase(),status:"",calificacion:""});
  guardar();
  render();
}

// EXPORTAR
function exportCSV(){
  let csv="Grupo,"+grupoActual+"\nFecha,"+fechaTexto+"\n\nNo,Alumno,Estado\n";
  alumnos.forEach((a,i)=>csv+=`${i+1},${a.name},${a.status}\n`);
  descargar(csv,`${grupoActual}_${fechaClave}_asistencia.csv`);
}

function exportCalificaciones(){
  let csv="Grupo,"+grupoActual+"\n\nNo,Alumno,Calificacion\n";
  alumnos.forEach((a,i)=>csv+=`${i+1},${a.name},${a.calificacion||""}\n`);
  descargar(csv,`${grupoActual}_${fechaClave}_calificaciones.csv`);
}

function descargar(contenido,nombre){
  let blob=new Blob([contenido]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=nombre;
  a.click();
}

cambiarGrupo();

</script>

</body>
</html>
